name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  engine-and-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Profit engine
        working-directory: engine
        run: npm test
      - name: Site
        working-directory: web
        run: |
          npm ci
          npm test
          npx tsc --noEmit
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: App unit tests
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon
